project_id = "financeapp-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
pooler_port = 54329

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[auth]
enabled = true
site_url = "financeapp-dev://auth/callback"
additional_redirect_urls = [
  "financeapp-dev://auth/callback",
  "financeapp-preview://auth/callback",
  "financeapp://auth/callback",
]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
email_optional = false

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[analytics]
enabled = false
